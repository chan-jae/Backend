name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test

#      - name: 빌드 결과 확인
#        run: ls -R build

      - name: jar 이름 고정
        run: mv build/libs/*SNAPSHOT.jar sc-springboot-app.jar

      - name: EC2로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "sc-springboot-app.jar"
          target: "/home/ubuntu/student-calendar"

      - name: EC2에서 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          # 비대화형 SSH는 .profile / .bashrc를 안 읽는 경우가 많음 → java, 환경변수 누락
          script: |
            set -e
            cd /home/ubuntu/student-calendar
            [ -f sc-springboot-app.jar ] || { echo "jar missing"; exit 1; }
            pkill -f sc-springboot-app.jar || true
            sleep 1
            set +e
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            set -e
            command -v java >/dev/null 2>&1 || { echo "java not in PATH (SSH non-interactive). Use full path or install default-jre."; exit 1; }
            nohup java -jar sc-springboot-app.jar >> sc-app.log 2>&1 </dev/null &
            sleep 3
            pgrep -af sc-springboot-app.jar || { echo "process did not start"; tail -100 sc-app.log 2>/dev/null || true; exit 1; }
