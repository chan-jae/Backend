name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          submodules: true
          token: '${{ secrets.PAT_REPO_TOKEN }}'

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test

#      - name: 빌드 결과 확인
#        run: ls -R build

      - name: jar 이름 고정
        run: mv build/libs/*SNAPSHOT.jar sc-springboot-app.jar

      - name: 서버로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: seochanhuck
          key: ${{ secrets.PRIVATE_KEY }}
          source: "sc-springboot-app.jar"
          target: "/home/seochanhuck/docker-migration/student-calendar"

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: seochanhuck
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e
            cd /home/seochanhuck/student-calendar
            [ -f student-calendar/sc-springboot-app.jar ] || { echo "jar missing"; exit 1; }
            cd /home/seochanhuck/docker-migration
            docker compose up -d --build sc-app

