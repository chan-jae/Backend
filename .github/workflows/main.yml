name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test

      - name: jar 이름 고정
        run: mv build/libs/*.jar sc-springboot-app.jar

      - name: EC2로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "sc-springboot-app.jar"
          target: "/home/ubuntu/student-calendar"

      - name: EC2에서 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            pkill -f sc-springboot-app.jar || true
            nohup java -jar /home/ubuntu/student-calendar/sc-springboot-app.jar > sc-app.log 2>&1 &
