name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test

#      - name: 빌드 결과 확인
#        run: ls -R build

      - name: jar 이름 고정
        run: mv build/libs/*SNAPSHOT.jar sc-springboot-app.jar

      - name: EC2로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "sc-springboot-app.jar"
          target: "/home/ubuntu/student-calendar"

      - name: EC2에서 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/student-calendar
            [ -f sc-springboot-app.jar ] || { echo "jar missing"; exit 1; }
            if lsof -i:8080 -t >/dev/null 2>&1; then
              kill -9 $(lsof -i:8080 -t)
            fi
            sleep 1
            set +e
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            set -e
            command -v java >/dev/null 2>&1 || { echo "java not in PATH"; exit 1; }
            # SSH에 stdout/stderr 묶이면 Actions가 대기 → 출력은 버림
            nohup java -jar -Dspring.profiles.active=prod -Duser.timezone=Asia/Seoul sc-springboot-app.jar >/dev/null 2>&1 &
